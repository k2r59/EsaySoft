<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>EasyPaste — contrôle local de transcription</title>
<style>body{font:18px system-ui;max-width:760px;margin:60px auto;color:#17392f;background:#f0f8f5}textarea{width:100%;height:150px;font:15px system-ui}output{display:block;margin-top:24px;white-space:pre-line}</style>
<h1>Contrôle local du presse-papiers</h1><p>Collez la transcription dans ce champ. Le contrôle affiche seulement ses dimensions.</p>
<textarea aria-label="Coller la transcription" placeholder="⌘V"></textarea><output aria-live="polite">Aucune copie reçue.</output>
<script>
document.querySelector('textarea').addEventListener('paste',event=>{
  const text=event.clipboardData.getData('text/plain');
  const rows=text.split(/\r?\n/).filter(line=>line.trim());
  const times=rows.filter(line=>/^\[?\d{1,3}:\d{2}/.test(line));
  const html=event.clipboardData.getData('text/html');
  const parsed=new DOMParser().parseFromString(html,'text/html');
  const source=parsed.querySelector('meta[name="easypaste-source-url"]')?.getAttribute('content');
  document.querySelector('output').textContent=`Copie reçue : ${text.length} caractères, ${rows.length} lignes non vides, ${times.length} lignes horodatées.\nFormats reçus : ${[...event.clipboardData.types].join(', ')}.\nSource reçue : ${source||'absente'}.\nContenu collé jamais exécuté ni affiché.`;
  event.preventDefault();
});
</script></html>
