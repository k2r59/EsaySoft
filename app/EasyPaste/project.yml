name: EasyPaste
options:
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: WN9MHL56A9
    PRODUCT_BUNDLE_IDENTIFIER: app.easypaste.mac
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    INFOPLIST_FILE: Configuration/Info.plist
    CODE_SIGN_ENTITLEMENTS: Configuration/iCloud.entitlements
    ARCHS: "arm64 x86_64"
targets:
  EasyPaste:
    type: application
    platform: macOS
    sources:
      - path: Sources/EasyPaste
        excludes: [Resources]
      - path: Sources/EasyPaste/Resources/clipboard-studio.png
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_NAME: EasyPaste
schemes:
  EasyPaste:
    build:
      targets:
        EasyPaste: all
    run:
      config: Debug
    archive:
      config: Release
